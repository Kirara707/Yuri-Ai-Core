name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.10"
  REDIS_HOST: localhost
  REDIS_PORT: 6379
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  POSTGRES_DB: yuri_test
  POSTGRES_USER: yuri
  POSTGRES_PASSWORD: test_password

jobs:
  # ── 代码质量检查 ────────────────────────
  lint:
    name: 代码规范检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linters
        run: pip install ruff mypy

      - name: Ruff lint
        run: ruff check backend/ --config pyproject.toml || true

      - name: Type check
        run: mypy backend/ --ignore-missing-imports || true

  # ── 单元测试 ────────────────────────────
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    needs: lint
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: yuri_test
          POSTGRES_USER: yuri
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yuri"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run tests
        env:
          LLM_API_KEY: "test-key"
          BERT_MODEL_PATH: "./models/checkpoint-47200"
        run: |
          pytest tests/ -v --tb=short --cov=backend --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ── Docker 构建 ─────────────────────────
  docker:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t yuri-ai-core:${{ github.sha }} .

      - name: Test Docker image
        run: |
          docker run --rm yuri-ai-core:${{ github.sha }} python -c "from backend.utils.config import settings; print(settings.app.name)"
